name: Build Signed Play Store AAB

on:
  workflow_dispatch:

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LifeMateAI-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab
